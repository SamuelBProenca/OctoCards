openapi: 3.0.3
info:
  title: OctoCards API
  version: 0.1.0-alpha
  description: |
    API pública para consultar dados de repositórios públicos do GitHub e produzir cartões JSON.
    No modo request (padrao), cada consumidor pode enviar seu proprio token GitHub em Authorization: Bearer;
    o servidor nao usa TOKEN como fallback. O modo server usa TOKEN configurado pelo operador e o modo
    anonymous nao aceita credenciais. Tokens por requisicao sao recebidos temporariamente em memoria,
    sem registro ou persistencia. Use HTTPS e somente servidores confiaveis. Colecoes falham por inteiro
    se algum repositorio solicitado falhar.
servers:
  - url: /
    description: Mesmo host que serve esta especificação
tags:
  - name: Cards
    description: Dados de um repositório ou de uma coleção
security:
  - GithubBearer: []
  - {}
paths:
  /api/cards/{repo}:
    get:
      tags: [Cards]
      summary: Consultar um cartão
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/Repo'
        - $ref: '#/components/parameters/Owner'
      responses:
        '200':
          description: Dados do repositório público
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCard'
              example:
                name: OctoCards
                description: '# OctoCards'
                principal_languages: [TypeScript, JavaScript]
                stars: 2
                forks: 0
                url: https://github.com/SamuelBProenca/OctoCards
                illustration_image_url: https://placehold.co/600x400
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/BudgetUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/cards:
    get:
      tags: [Cards]
      summary: Consultar vários cartões
      operationId: getCards
      description: Retorna até 10 cartões únicos na ordem solicitada. Nomes repetidos sem diferenciar maiúsculas/minúsculas são consultados uma vez. Se qualquer repositório falhar, a resposta contém um erro em vez de resultados parciais.
      parameters:
        - name: repos
          in: query
          required: true
          description: De 1 a 10 nomes separados por vírgulas; cada nome pode ter até 100 caracteres; a query inteira pode ter até 2048 caracteres. Duplicatas sem diferenciar maiúsculas/minúsculas são consultadas uma vez. Não inclua owner/repo.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          example: OctoCards,LinkKeeper
        - $ref: '#/components/parameters/Owner'
      responses:
        '200':
          description: Cartões dos repositórios solicitados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitCard'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/BudgetUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    GithubBearer:
      type: http
      scheme: bearer
      bearerFormat: GitHub token (optional; depends on server auth mode)
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      description: Nome de um repositório público; até 100 caracteres ASCII entre letras, números, ponto, hífen e sublinhado.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9._-]+$"
      example: OctoCards
    Owner:
      name: owner
      in: query
      required: false
      description: Conta ou organização do GitHub, até 39 caracteres ASCII alfanuméricos e hífen, sem hífen no início/fim ou hífens consecutivos. Se omitido, usa OWNER configurado no servidor.
      schema:
        type: string
        minLength: 1
        maxLength: 39
        pattern: "^(?!.*--)[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$"
      example: SamuelBProenca
  schemas:
    GitCard:
      type: object
      required: [name, description, principal_languages, stars, forks, url, illustration_image_url]
      properties:
        name:
          type: string
          description: Nome do repositório.
        description:
          type: string
          description: Conteúdo bruto do README; usa "Sem descrição" se não houver README.
        principal_languages:
          type: array
          items:
            type: string
          description: Linguagens detectadas; usa "Desconhecido" se a API não retornar linguagens.
        stars:
          type: integer
          minimum: 0
        forks:
          type: integer
          minimum: 0
        url:
          type: string
          format: uri
        illustration_image_url:
          type: string
          format: uri
          description: Imagem escolhida entre banner/capa/hero/social preview, outros arquivos de imagem da árvore do repositório e imagens citadas no README; usa placeholder se nenhuma estiver disponível.
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    InvalidRequest:
      description: Parâmetro ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: GitHub rejeitou a credencial configurada no servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: GitHub negou acesso ao recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Repositório inexistente, inacessível ou privado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Limite por IP do OctoCards atingido (API_RATE_LIMITED) ou cota do GitHub esgotada (GITHUB_RATE_LIMITED). Aguarde o período indicado em Retry-After.
      headers:
        Retry-After:
          schema:
            type: string
          description: Tempo de espera em segundos, quando fornecido pelo limite local ou pelo GitHub.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BudgetUnavailable:
      description: Shared request budget store unavailable; the API fails closed without calling GitHub.
      headers:
        Retry-After:
          schema:
            type: string
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Erro interno do servidor ou configuração inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: Falha inesperada ao consultar o GitHub
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Timeout:
      description: Tempo limite excedido ao consultar o GitHub
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'